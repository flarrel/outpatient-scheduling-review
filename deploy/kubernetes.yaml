apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpatient-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outpatient-review
  template:
    metadata:
      labels:
        app: outpatient-review
    spec:
      containers:
        - name: review
          image: outpatient-review:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: outpatient-review
spec:
  selector:
    app: outpatient-review
  ports:
    - port: 8080
      targetPort: http
